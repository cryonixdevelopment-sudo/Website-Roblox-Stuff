<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090b10" />
    <meta name="description" content="cool — a simple proxy for authorized browsing." />
    <title>cool</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/uv/uv.bundle.js" defer></script>
    <script src="/uv.config.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="cool home">
        <img class="brand-mark" src="/icon-192.png" alt="" />
        <span>cool</span>
      </a>
      <nav class="controls" aria-label="Browser controls">
        <button id="back" class="icon-button" type="button" aria-label="Go back">←</button>
        <button id="forward" class="icon-button" type="button" aria-label="Go forward">→</button>
        <button id="reload" class="icon-button" type="button" aria-label="Reload">↻</button>
        <button id="home" class="icon-button" type="button" aria-label="Home">⌂</button>
      </nav>
      <form id="address-form" class="address-form" autocomplete="off">
        <label class="sr-only" for="address">Enter a URL or search</label>
        <span class="secure-dot" aria-hidden="true"></span>
        <input id="address" type="text" inputmode="url" placeholder="Search or enter a URL" autocapitalize="none" spellcheck="false" />
        <button type="submit">Go</button>
      </form>
    </header>
    <main>
      <section id="welcome" class="welcome">
        <div class="glow" aria-hidden="true"></div>
        <div class="welcome-card">
          <span class="eyebrow">AUTHORIZED USE ONLY</span>
          <h1>Browse with <span>cool.</span></h1>
          <p>A lightweight, self-hosted starting point. Enter a website above to begin.</p>
          <form id="hero-form" class="hero-search" autocomplete="off">
            <label class="sr-only" for="hero-address">Enter a URL or search</label>
            <input id="hero-address" type="text" inputmode="url" placeholder="example.com or search terms" autocapitalize="none" spellcheck="false" />
            <button type="submit">Open</button>
          </form>
          <p class="notice">Only access websites and networks you are authorized to use.</p>
        </div>
      </section>
      <section id="browser" class="browser" hidden>
        <iframe id="viewport" title="Proxied website" allow="fullscreen; clipboard-read; clipboard-write" referrerpolicy="no-referrer"></iframe>
      </section>
      <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    </main>
  </body>
</html>
