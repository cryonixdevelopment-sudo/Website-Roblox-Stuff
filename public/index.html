<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07070a" />
    <meta name="description" content="Orvian — a personal start page for Windows and ChromeOS." />
    <title>Orvian</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="dashboard">
      <section class="launcher" aria-labelledby="brand">
        <h1 id="brand" aria-label="Orvian"><span style="--i:0">O</span><span style="--i:1">r</span><span style="--i:2">v</span><span style="--i:3">i</span><span style="--i:4">a</span><span style="--i:5">n</span></h1>

        <form id="search-form" class="search" role="search">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.5-4.5m2-5.25a7.25 7.25 0 1 1-14.5 0 7.25 7.25 0 0 1 14.5 0Z"/></svg>
          <label class="sr-only" for="search-input">Search DuckDuckGo or enter a URL</label>
          <input id="search-input" placeholder="Search or enter URL..." autocomplete="off" autofocus />
        </form>

        <div id="shortcut-grid" class="shortcut-grid">
          <a class="tile" href="https://www.instagram.com/"><span class="tile-icon brand-icon"><img src="/icons/instagram.svg" alt="" /></span><span>Instagram</span></a>
          <a class="tile" href="https://open.spotify.com/"><span class="tile-icon brand-icon"><img src="/icons/spotify.svg" alt="" /></span><span>Spotify</span></a>
          <a class="tile" href="https://www.roblox.com/"><span class="tile-icon brand-icon"><img src="/icons/roblox.svg" alt="" /></span><span>Roblox</span></a>
          <a class="tile" href="https://poki.com/"><span class="tile-icon"><svg viewBox="0 0 24 24"><path d="M7 9h10a4 4 0 0 1 3.8 5.2l-1.1 3.3a2 2 0 0 1-3.2.9L14 16h-4l-2.5 2.4a2 2 0 0 1-3.2-.9l-1.1-3.3A4 4 0 0 1 7 9Z"/><path d="M8 12v3m-1.5-1.5h3M16.5 12.8h.01m1.49 1.4h.01"/></svg></span><span>Play</span></a>
          <a class="tile" href="https://www.youtube.com/"><span class="tile-icon"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18m8-18v18M4 8h4m8 0h4M4 16h4m8 0h4"/></svg></span><span>Movies</span></a>
          <a class="tile" href="https://www.crunchyroll.com/"><span class="tile-icon"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="m8 2 4 4 4-4M8 15h.01"/></svg></span><span>Anime</span></a>
          <a class="tile" href="https://music.youtube.com/"><span class="tile-icon"><svg viewBox="0 0 24 24"><path d="M9 18V5l10-2v13M9 9l10-2"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg></span><span>Music</span></a>
          <button class="tile" type="button" data-panel="links-dialog"><span class="tile-icon"><svg viewBox="0 0 24 24"><path d="M5 11V7a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v4M4 11h16a2 2 0 0 1 2 2v5H2v-5a2 2 0 0 1 2-2Zm0 7v3m16-3v3"/></svg></span><span>Lounge</span></button>
          <a class="tile" href="https://discord.com/app"><span class="tile-icon"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H8l-5 2 1.7-4A8.5 8.5 0 1 1 21 12Z"/></svg></span><span>Chat</span></a>
          <button id="add-bookmark" class="tile add-tile" type="button"><span class="tile-icon">＋</span><span>Add bookmark</span></button>
        </div>

        <a class="trending" href="https://trends.google.com/trending"><span>♨</span> Trending</a>
      </section>

      <nav class="utility-dock" aria-label="Utilities">
        <button type="button" data-panel="links-dialog"><span>↗</span> Links</button>
        <button type="button" data-panel="settings-dialog"><span>⚙</span> Settings</button>
        <button type="button" data-panel="account-dialog"><span>♙</span> Account</button>
        <button id="clear-data" class="danger" type="button"><span>♜</span> Clear data</button>
        <button type="button" data-panel="tabs-dialog"><span>▱</span> Tabs</button>
      </nav>
    </main>

    <dialog id="links-dialog"><form method="dialog"><button class="close" aria-label="Close">×</button></form><p class="dialog-kicker">ORVIAN</p><h2>Your links</h2><div id="saved-links" class="saved-links"></div><button id="dialog-add-link" class="primary" type="button">Add a link</button></dialog>
    <dialog id="settings-dialog"><form method="dialog"><button class="close" aria-label="Close">×</button></form><p class="dialog-kicker">PERSONALIZE</p><h2>Settings</h2><label class="setting"><span>Search engine</span><select id="search-engine"><option value="ddg">DuckDuckGo</option><option value="google">Google</option><option value="bing">Bing</option></select></label><label class="setting"><span>Open links in new tabs</span><input id="new-tab-setting" type="checkbox" /></label><label class="setting"><span>Reduce motion</span><input id="motion-setting" type="checkbox" /></label></dialog>
    <dialog id="account-dialog"><form method="dialog"><button class="close" aria-label="Close">×</button></form><p class="dialog-kicker">LOCAL PROFILE</p><h2>Account</h2><p class="muted">Your profile stays in this browser and is never uploaded.</p><label class="field">Display name<input id="display-name" maxlength="30" placeholder="Your name" /></label><button id="save-profile" class="primary" type="button">Save locally</button></dialog>
    <dialog id="tabs-dialog"><form method="dialog"><button class="close" aria-label="Close">×</button></form><p class="dialog-kicker">RECENT</p><h2>Tabs</h2><p class="muted">Orvian opens ordinary browser tabs. Use your browser’s tab bar to manage them.</p></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
