<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090b10" />
    <meta name="description" content="Orvian — a web proxy optimized for Windows and Chromebooks." />
    <title>Orvian</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/uv/uv.bundle.js" defer></script>
    <script src="/uv.config.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body class="home-mode">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Orvian home">
        <img class="brand-mark" src="/icon-192.png" alt="" />
        <span>Orvian</span>
      </a>
      <nav class="controls" aria-label="Browser controls">
        <button id="back" class="icon-button" type="button" aria-label="Go back">←</button>
        <button id="forward" class="icon-button" type="button" aria-label="Go forward">→</button>
        <button id="reload" class="icon-button" type="button" aria-label="Reload">↻</button>
        <button id="home" class="icon-button" type="button" aria-label="Home">⌂</button>
      </nav>
      <form id="address-form" class="address-form" autocomplete="off">
        <label class="sr-only" for="address">Enter a URL or search</label>
        <span class="secure-dot" aria-hidden="true"></span>
        <input id="address" type="text" inputmode="url" placeholder="Search or enter a URL" autocapitalize="none" spellcheck="false" />
        <button type="submit">Go</button>
      </form>
    </header>
    <main>
      <section id="welcome" class="welcome">
        <div class="glow" aria-hidden="true"></div>
        <div class="home-shell">
          <div class="home-identity">
            <img src="/icon-192.png" alt="" />
            <h1><span class="orvian-word" aria-label="Orvian"><span class="orvian-letter" style="--letter: 0" aria-hidden="true">O</span><span class="orvian-letter" style="--letter: 1" aria-hidden="true">r</span><span class="orvian-letter" style="--letter: 2" aria-hidden="true">v</span><span class="orvian-letter" style="--letter: 3" aria-hidden="true">i</span><span class="orvian-letter" style="--letter: 4" aria-hidden="true">a</span><span class="orvian-letter" style="--letter: 5" aria-hidden="true">n</span></span></h1>
          </div>
          <form id="hero-form" class="hero-search" autocomplete="off">
            <label class="sr-only" for="hero-address">Enter a URL or search</label>
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.6-4.6m2.1-5.15a7.25 7.25 0 1 1-14.5 0 7.25 7.25 0 0 1 14.5 0Z"/></svg>
            <input id="hero-address" type="text" inputmode="url" placeholder="Search or enter URL..." autocapitalize="none" spellcheck="false" />
            <button type="submit" aria-label="Open">→</button>
          </form>

          <div class="shortcut-grid" aria-label="Quick links">
            <button class="shortcut" type="button" data-target="https://www.google.com"><span class="shortcut-icon google">G</span><span>Google</span></button>
            <button class="shortcut" type="button" data-target="https://open.spotify.com"><span class="shortcut-icon spotify">≋</span><span>Spotify</span></button>
            <button class="shortcut" type="button" data-target="https://www.youtube.com"><span class="shortcut-icon youtube">▶</span><span>YouTube</span></button>
            <button class="shortcut" type="button" data-target="https://www.roblox.com"><span class="shortcut-icon roblox">◇</span><span>Roblox</span></button>
            <button class="shortcut" type="button" data-target="https://www.wikipedia.org"><span class="shortcut-icon wikipedia">W</span><span>Wikipedia</span></button>
            <button class="shortcut" type="button" data-target="https://github.com"><span class="shortcut-icon github">⌘</span><span>GitHub</span></button>
            <button id="add-shortcut" class="shortcut add-shortcut" type="button"><span class="shortcut-icon">＋</span><span>Add shortcut</span></button>
          </div>

          <button class="discover-chip" type="button" data-target="https://trends.google.com"><span aria-hidden="true">⌁</span> Discover</button>
          <p class="notice">For authorized use · Optimized for Windows and ChromeOS</p>
          <nav class="home-dock" aria-label="Orvian">
            <button type="button" data-focus-search><span>⌕</span>Search</button>
            <button type="button" data-target="https://www.google.com/bookmarks"><span>◇</span>Links</button>
            <button type="button" data-focus-search><span>⚙</span>Settings</button>
            <button type="button" data-clear-data class="danger"><span>⌫</span>Clear data</button>
          </nav>
        </div>
      </section>
      <section id="browser" class="browser" hidden>
        <iframe id="viewport" title="Proxied website" allow="fullscreen; clipboard-read; clipboard-write" referrerpolicy="no-referrer"></iframe>
      </section>
      <div id="status" class="status" role="status" aria-live="polite" hidden></div>
      <div id="compatibility" class="compatibility" role="note" hidden>
        Limited support on this device. Orvian is designed for Windows and ChromeOS.
      </div>
    </main>
  </body>
</html>
